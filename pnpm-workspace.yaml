packages:
  - "packages/i18n"
  - "apps/client"
  - "apps/desktop"
  - "packages/client-db"
  - "packages/configs"
  - "packages/contract"
  - "packages/core"
  - "packages/editor"
  - "packages/file-storage"
  - "packages/markdown"
  - "packages/merge"
  - "packages/ports"
  - "packages/sync"
  - "packages/tokens"
  - "packages/ui-kit"
  - "packages/utils"
  - "packages/vault"
  - "packages/e2e"

minimumReleaseAgeStrict: true
# My own package
minimumReleaseAgeExclude:
  - bakemd

allowBuilds:
  esbuild: true

# Dependabot advisory
overrides:
  # One React instance shared by Bordena providers and hooks.
  react: 19.2.3
  react-dom: 19.2.3
  brace-expansion: ^5.0.12
  postcss: ^8.5.18
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2
  compression: ^1.8.2
  undici: ^7.29.1
  js-yaml: ^4.3.1
  nanoid: ^3.3.17
  # drizzle-kit still pulls the deprecated @esbuild-kit chain, pinned to 0.18.
  esbuild@<0.24.3: ^0.25.12
  # Transitive CommonJS callers cannot use uuid 14.
  uuid@7: ^11.1.1
