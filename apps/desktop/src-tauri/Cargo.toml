[package]
name = "bordena"
version = "1.0.0"
description = "Offline project manager"
authors = ["Stanislav Smirnov", "CHOPIK Team"]
license = "MIT"
edition = "2021"

[lib]
name = "bordena_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
# Restores dialog-granted fs paths across launches, so a card keeps writing to
# the file the user picked without re-prompting.
tauri-plugin-persisted-scope = "2"
tauri-plugin-window-state = "2"
# Referenced by the generate_context! macro once the updater pubkey is embedded.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

# Auto-update is desktop-only; the updater crate doesn't build for mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# The quick-note popup is re-classed into a non-activating NSPanel, so it can
# take the keyboard over another app's fullscreen Space without activating
# Doska (which would switch Spaces). Tauri has no setting for any of this.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSWindow", "NSPanel"] }
